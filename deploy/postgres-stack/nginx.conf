worker_processes auto;
events { worker_connections 4096; }

http {
  # DNS interno do Docker. Os serviços são resolvidos no momento de cada
  # requisição; a ausência temporária de Realtime/Auth/etc. não derruba todo o
  # gateway durante o boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 512m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # ---------------------------------------------------------------------------
  # CORS: o Kong do Supabase respondia os preflights e devolvia os cabeçalhos
  # de origem. Sem isso o navegador aborta a requisição antes da resposta e o
  # frontend mostra "Não foi possível conectar ao servidor".
  # ---------------------------------------------------------------------------
  map $http_origin $cors_origin { default $http_origin; '' '*'; }

  # ---------------------------------------------------------------------------
  # Fast-path da verificação de webhook da Meta.
  # A Meta envia GET com hub.mode=subscribe (e cópias com underscore:
  # hub_mode, hub_challenge, hub_verify_token) e tem timeout curto. O boot
  # frio do runtime Deno fazia a Meta desistir antes da resposta (HTTP 499
  # no log). O gateway responde o challenge diretamente, sem subir para a
  # edge function.
  # ATENÇÃO: o token abaixo precisa ser IDÊNTICO ao META_WEBHOOK_VERIFY_TOKEN
  # definido em secrets.env. Se trocar o token, troque nos dois lugares.
  # ---------------------------------------------------------------------------
  map "$request_method|$arg_hub_mode|$arg_hub_verify_token" $meta_webhook_challenge {
    default "";
    "GET|subscribe|MRO_Meta_Webhook_2026_X7K9P2Q8" $arg_hub_challenge;
  }


  # Mesmas rotas do Supabase => frontend não muda, só a URL base.
  server {
    listen 8000;
    server_name _;

    location = /health { return 200 'ok'; add_header Content-Type text/plain; }

    location /auth/v1/ {
      # Remove os cabeçalhos vindos do upstream para não duplicar.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
      add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
      add_header Access-Control-Expose-Headers 'content-range, content-length, x-total-count, content-profile' always;
      add_header Access-Control-Max-Age 86400 always;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
      }
      set $auth_upstream http://auth:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
      # Remove os cabeçalhos vindos do upstream para não duplicar.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
      add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
      add_header Access-Control-Expose-Headers 'content-range, content-length, x-total-count, content-profile' always;
      add_header Access-Control-Max-Age 86400 always;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
      }
      set $rest_upstream http://rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest_upstream;
      proxy_set_header Host $host;
      proxy_set_header Accept-Profile $http_accept_profile;
      proxy_set_header Content-Profile $http_content_profile;
    }

    location /realtime/v1/ {
      set $realtime_upstream http://realtime:4000;
      rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
      proxy_pass $realtime_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Realtime resolve o tenant pelo Host. O domínio público causava
      # transportConnect porque não corresponde ao tenant self-hosted criado
      # por SEED_SELF_HOST.
      proxy_set_header Host realtime-dev.supabase-realtime;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location /storage/v1/ {
      # Remove os cabeçalhos vindos do upstream para não duplicar.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
      add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
      add_header Access-Control-Expose-Headers 'content-range, content-length, x-total-count, content-profile' always;
      add_header Access-Control-Max-Age 86400 always;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
      }
      set $storage_upstream http://storage:5000;
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass $storage_upstream;
      proxy_set_header Host $host;

      # Streaming de vídeo: repassar Range/If-Range sem bufferizar o corpo, para
      # o navegador começar a tocar no primeiro chunk em vez de esperar o arquivo.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # Objetos públicos são imutáveis (nome com hash/timestamp): cache longo no
      # navegador evita rebaixar o mesmo vídeo a cada abertura.
      location ~* ^/storage/v1/object/public/.+\.(mp4|webm|mov|m4v|jpg|jpeg|png|webp|gif|svg)$ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers 'content-range, content-length, accept-ranges' always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;

        set $storage_media_upstream http://storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass $storage_media_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
    }

    location /functions/v1/ {
      # Remove os cabeçalhos vindos do upstream para não duplicar.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
      add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
      add_header Access-Control-Expose-Headers 'content-range, content-length, x-total-count, content-profile' always;
      add_header Access-Control-Max-Age 86400 always;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header Access-Control-Allow-Headers 'authorization, apikey, x-client-info, content-type, content-profile, accept-profile, prefer, range, x-upsert, x-requested-with, cache-control, x-region, x-supabase-api-version, x-request-id, x-admin-session, x-admin-token, x-acessor-admin-token' always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
      }
      # Fast-path: verificação de webhook da Meta respondida pelo gateway.
      if ($meta_webhook_challenge != "") {
        add_header Content-Type text/plain;
        return 200 $meta_webhook_challenge;
      }
      set $functions_upstream http://functions:9000;
      rewrite ^/functions/v1/(.*)$ /$1 break;
      proxy_pass $functions_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Fluxos com vários blocos (mídia, delays, IA) podem levar minutos.
      # Sem isso o Nginx cortava em 60s e o front recebia "non-2xx status code".
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
